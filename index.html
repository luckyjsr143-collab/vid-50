<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        .img1{
            filter: blur(20px);
        }
        .img2{
            filter: contrast(200%);
        }
        .img3{
            filter: sepia(60%)
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://media.magnific.com/home/relaunch/media/useCases/advertising.webp" alt="">
        <img width="300" class="img2" src="https://cdn.britannica.com/91/267391-050-9025A36D/indian-actor-akshay-kumar-red-sea-international-film-festival-december-2022.jpg" alt="">
        <img width="300" class="img3" src="https://static.india.com/wp-content/uploads/2026/04/Sanjay-Dutt-as-Ballu.jpg?impolicy=Medium_Widthonly&w=700" alt="">
    </div>
</body>
</html>
